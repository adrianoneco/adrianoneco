<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Adriano Neco — Software Developer, AI and Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#050B16"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.12" cy="0.92" r="0.62">
      <stop offset="0" stop-color="#00D69A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00D69A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.86" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#22C7E8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22C7E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D69A"/>
      <stop offset="1" stop-color="#22C7E8"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D69A"/>
      <stop offset="1" stop-color="#22C7E8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow-a)"/>
  <rect width="1200" height="320" fill="url(#glow-b)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <rect x="0" y="319" width="1200" height="1" fill="url(#rule)" opacity="0.55"/>

  <g font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="72" y="118" font-size="54" font-weight="700" letter-spacing="3" fill="#F4F7FB">ADRIANO NECO</text>
    <rect x="74" y="140" width="96" height="3" rx="1.5" fill="url(#mono)"/>
    <text x="74" y="182" font-size="21" font-weight="600" letter-spacing="0.6" fill="#A7B7CC">Software Developer</text>
    <text x="74" y="214" font-size="16" letter-spacing="0.3" fill="#71839B">AI agents · Automation · Backend &amp; APIs</text>

    <g>
      <rect x="74" y="243" width="272" height="34" rx="17" fill="#00D69A" fill-opacity="0.10" stroke="#00D69A" stroke-opacity="0.55"/>
      <circle cx="98" cy="260" r="4.5" fill="#00D69A"/>
      <text x="116" y="266" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#34E6B4">OPEN TO OPPORTUNITIES</text>
    </g>
  </g>

  <g transform="translate(1010 100)">
    <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="28" fill="#0E1D32" stroke="url(#mono)" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="60" y="76" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="1" fill="#F4F7FB" text-anchor="middle">AN</text>
    <circle cx="0" cy="0" r="6" fill="#00D69A" fill-opacity="0.9"/>
    <circle cx="119" cy="119" r="6" fill="#22C7E8" fill-opacity="0.8"/>
  </g>
